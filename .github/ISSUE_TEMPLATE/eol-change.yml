name: EOL 产品变更申请
description: 新增 / 修改 / 删除官网 EOL 产品清单里的一条记录（填表即可，不用改文件）
title: "[EOL] "
labels: ["eol-change"]
body:
  - type: markdown
    attributes:
      value: |
        填完提交后，机器人会自动把这条变更写进数据文件并开一个 PR，
        由维护人核对后合并；合并后官网的 EOL 表格会自动更新。

        **你不需要懂 Git，也不用编辑任何文件。** 一次只填一条记录，
        多条就多提几个申请。

  - type: dropdown
    id: action
    attributes:
      label: 操作类型
      options:
        - 新增
        - 修改
        - 删除
      default: 0
    validations:
      required: true

  - type: dropdown
    id: site
    attributes:
      label: 适用站点
      description: 中英文两个站的清单是独立的，按实际需要选。
      options:
        - 中文站
        - 英文站
        - 两个站都要
      default: 0
    validations:
      required: true

  - type: input
    id: discontinued
    attributes:
      label: 停产产品系列
      description: 要停产的型号。中文站写「系列」，英文站写「Series」。
      placeholder: 例：IR305-FQ33系列 / IR305-FQ33 Series
    validations:
      required: true

  - type: input
    id: replacement
    attributes:
      label: 替代产品系列
      description: 推荐客户改用的型号。「删除」操作可不填。
      placeholder: 例：IR315-FQ38系列 / IR315-FQ38 Series

  - type: input
    id: order_stop_date
    attributes:
      label: 停止订购日期
      description: 格式 YYYY-MM-DD。「删除」操作可不填。
      placeholder: 2027-01-01

  - type: input
    id: production_stop_date
    attributes:
      label: 停止生产日期
      placeholder: 2027-03-01

  - type: input
    id: support_stop_date
    attributes:
      label: 停止支持日期
      placeholder: 2030-01-01

  - type: textarea
    id: note
    attributes:
      label: 补充说明
      description: 变更原因、依据的通知文件等，选填。机器人不会写进表格，仅供审核参考。
