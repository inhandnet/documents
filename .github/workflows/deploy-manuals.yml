name: Deploy Manuals to Formal Server

on:
  pull_request:
    branches: [master]
    paths: ["docs/**"]
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "mkdocs.en.yml"
      # EOL 清单：页面在构建期由 data/ 生成，改清单要重新发布站点
      - "data/eol-products.*.md"
  workflow_dispatch:
    inputs:
      validate_all:
        description: "全量校验（校验 docs/ 下所有文件）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Upload non-Markdown files to Cloud Storage
      - name: Upload docs files to Cloud Storage
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PLM_API_ZHENG_ZH_URL: ${{ secrets.PLM_API_ZHENG_ZH_URL }}
          PLM_API_ZHENG_ZH_TOKEN: ${{ secrets.PLM_API_ZHENG_ZH_TOKEN }}
          PLM_API_ZHENG_EN_URL: ${{ secrets.PLM_API_ZHENG_EN_URL }}
          PLM_API_ZHENG_EN_TOKEN: ${{ secrets.PLM_API_ZHENG_EN_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          pip install requests
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "增量上传（只传变更文件）"
            python scripts/upload_specs_to_cloud.py --dist-dir docs --incremental
          else
            echo "全量上传"
            python scripts/upload_specs_to_cloud.py --dist-dir docs
          fi

      # 1.5 Regenerate the EOL pages from data/eol-products.{zh,en}.md.
      # generate-llms.yml also commits them, but its commit carries
      # "[skip ci]" and therefore never triggers this workflow — building
      # them here keeps the published site current on the same run.
      # Deterministic and .md-only, so it cannot affect the cloud upload
      # (step 1 runs first and skips .md) or the git-diff based validation.
      - name: Generate EOL pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/generate_eol_pages.py

      # 2. Generate product index pages
      - name: Generate Product Index Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/generate_product_index.py --report

      # 2.5 Generate llms-full.txt (deploy-time artifact, gitignored:
      # whole corpus in one file for one-shot AI ingestion; mkdocs copies
      # *.txt into the site output as static assets)
      - name: Generate llms-full.txt
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/generate_llms_txt.py --full

      # 2.7 Generate product-level .nav.yml (flatten the Manuals nav level;
      # build-time artifact, gitignored — hand-written ones are kept as-is)
      - name: Generate nav files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/generate_nav_files.py

      # 3. Build sites
      - name: Build (zh)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m mkdocs build -f mkdocs.yml -d site-zh --clean

      - name: Build (en)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m mkdocs build -f mkdocs.en.yml -d site-en --clean

      # 4. Clean cloud-storage files from build output (keep only site assets)
      - name: Clean cloud-storage files from site output
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # Remove files served from cloud storage (PDF, CFG, DAT, etc.)
          # Keep HTML/CSS/JS/images/fonts — only files needed by the static site
          for site in site-zh site-en; do
            if [ -d "$site" ]; then
              find "$site" -type f \
                ! -name "*.html" \
                ! -name "*.css" \
                ! -name "*.js" \
                ! -name "*.png" \
                ! -name "*.jpg" \
                ! -name "*.jpeg" \
                ! -name "*.gif" \
                ! -name "*.svg" \
                ! -name "*.webp" \
                ! -name "*.ico" \
                ! -name "*.woff" \
                ! -name "*.woff2" \
                ! -name "*.ttf" \
                ! -name "*.eot" \
                ! -name "*.json" \
                ! -name "*.xml" \
                ! -name "*.txt" \
                ! -name "*.md" \
                -delete
            fi
          done
          echo "Cleaned cloud-storage files from site output"

      # 4.3 Pre-generate downloadable PDFs for manual pages (X.html -> X.pdf).
      # Must run AFTER step 4: the clean step deletes *.pdf from the build
      # output, which would wipe these. Incremental: unchanged manuals are
      # downloaded back from the live site instead of re-rendered
      # (fingerprint manifest, see scripts/generate_manual_pdfs.py).
      - name: Generate manual PDFs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          pip install playwright pymupdf
          python -m playwright install --with-deps chromium
          python scripts/generate_manual_pdfs.py --site-dir site-zh --lang zh \
            --reuse-base https://www.inhand.com.cn/manuals/
          python scripts/generate_manual_pdfs.py --site-dir site-en --lang en \
            --reuse-base https://www.inhand.com/manuals/

      # 4.5 Publish markdown twins: every X.html gets its X.md source next
      # to it (llms.txt links point at these .md paths — clean markdown is
      # what AI crawlers consume). Pure additive copy; existing HTML URLs
      # are untouched.
      - name: Copy markdown twins into site output
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          for pair in "zh:site-zh" "en:site-en"; do
            lang="${pair%%:*}"; site="${pair##*:}"
            if [ -d "$site" ]; then
              (cd "docs/$lang" && find . -name "*.md" -exec cp --parents {} "../../$site/" \;)
              echo "$site: copied $(find "$site" -name '*.md' | wc -l) markdown twins"
            fi
          done

      # 5. Deploy via rsync --delete (mirror sync).
      # Switched from scp-action: the servers' ForceCommand wrapper blocks
      # drone-scp's remote tar exec but explicitly allows `rsync --server ...
      # /data/wordpress/manuals`. rsync also gives incremental transfer
      # (seconds, not minutes) and --delete removes server-side orphans
      # (fixes the scp rm:false accumulation, TODO #23).
      - name: Install rsync tooling
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: sudo apt-get update -q && sudo apt-get install -y -q sshpass rsync

      # Empty-build fuse: never let a broken/empty build wipe a server via
      # --delete. Require index.html + a sane file count for each site.
      - name: Guard against empty build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          for s in site-zh site-en; do
            test -f "$s/index.html" || { echo "FUSE: $s/index.html missing"; exit 1; }
            n=$(find "$s" -type f | wc -l)
            [ "$n" -gt 200 ] || { echo "FUSE: $s has only $n files"; exit 1; }
            echo "$s: $n files, ok"
          done

      - name: Deploy Chinese site to Domestic Server
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          H: ${{ secrets.CN_OVERSEAS_HOST }}
          U: ${{ secrets.CN_OVERSEAS_USER }}
          P: ${{ secrets.CN_OVERSEAS_PASS }}
        run: |
          sshpass -p "$P" rsync -az --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site-zh/ "$U@$H:/data/wordpress/manuals/"

      # 新中文站（CN_OVERSEAS_HOST_NEW）。用与现有中文站相同的账密和路径。
      # continue-on-error：部署失败不阻塞现有流程，便于先验证新站是否可用。
      - name: Deploy Chinese site to New Server
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          H: ${{ secrets.CN_OVERSEAS_HOST_NEW }}
          U: ${{ secrets.CN_OVERSEAS_USER }}
          P: ${{ secrets.CN_OVERSEAS_PASS }}
        run: |
          sshpass -p "$P" rsync -az --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site-zh/ "$U@$H:/data/wordpress/manuals/"

      - name: Deploy English site to Overseas Server
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          H: ${{ secrets.OVERSEAS_HOST }}
          U: ${{ secrets.OVERSEAS_USER }}
          P: ${{ secrets.OVERSEAS_PASS }}
        run: |
          sshpass -p "$P" rsync -az --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site-en/ "$U@$H:/data/wordpress/manuals/"

      - name: Deploy English site to Overseas Server (NEW)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          H: ${{ secrets.OVERSEAS_HOST_NEW }}
          U: ${{ secrets.OVERSEAS_USER }}
          P: ${{ secrets.OVERSEAS_PASS }}
        run: |
          sshpass -p "$P" rsync -az --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site-en/ "$U@$H:/data/wordpress/manuals/"

      # 6. Sync paths to resource center (validate)
      - name: Sync docs paths
        env:
          PLM_API_ZHENG_ZH_URL: ${{ secrets.PLM_API_ZHENG_ZH_URL }}
          PLM_API_ZHENG_ZH_TOKEN: ${{ secrets.PLM_API_ZHENG_ZH_TOKEN }}
          PLM_API_ZHENG_EN_URL: ${{ secrets.PLM_API_ZHENG_EN_URL }}
          PLM_API_ZHENG_EN_TOKEN: ${{ secrets.PLM_API_ZHENG_EN_TOKEN }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
        run: |
          pip install requests
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.validate_all }}" = "true" ]; then
            echo "Running full sync (--all)"
            python scripts/validate_docs.py --all
          else
            echo "Running incremental sync (--diff)"
            python scripts/validate_docs.py --diff
          fi

      # 7. Forbid deleted files
      - name: Forbid deleted docs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PLM_API_ZHENG_ZH_URL: ${{ secrets.PLM_API_ZHENG_ZH_URL }}
          PLM_API_ZHENG_ZH_TOKEN: ${{ secrets.PLM_API_ZHENG_ZH_TOKEN }}
          PLM_API_ZHENG_EN_URL: ${{ secrets.PLM_API_ZHENG_EN_URL }}
          PLM_API_ZHENG_EN_TOKEN: ${{ secrets.PLM_API_ZHENG_EN_TOKEN }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
        run: |
          pip install requests
          python scripts/validate_docs.py --forbid-deleted

      # 8. Post-deploy health check: the AI/crawler entry points must be
      # live and correct after every deploy (site_url regressions, dead
      # sitemap, missing llms.txt would otherwise go unnoticed).
      - name: Post-deploy health check
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 "$1")
            if [ "$code" != "200" ]; then echo "FAIL $code $1"; exit 1; fi
            echo "OK $1"
          }
          for base in "https://www.inhand.com.cn/manuals" "https://www.inhand.com/manuals"; do
            check "$base/index.html"
            check "$base/sitemap.xml"
            check "$base/llms.txt"
            check "$base/llms-full.txt"
            # homepage must be the generated product directory
            curl -s "$base/index.html" | grep -q "AUTO-GENERATED" \
              || { echo "FAIL homepage marker $base"; exit 1; }
            echo "OK homepage marker $base"
            # first sitemap URL must resolve (catches wrong site_url)
            u=$(curl -s "$base/sitemap.xml" | grep -o "<loc>[^<]*" | head -1 | sed 's/<loc>//')
            check "$u"
            # first llms.txt document link must resolve (md twins present)
            rel=$(grep -o "](.*\.md)" <(curl -s "$base/llms.txt") | head -1 | sed 's/^](//;s/)$//')
            check "$base/$rel"
            # first manual PDF from the manifest must resolve and be a real PDF
            check "$base/pdf-manifest.json"
            # URL-encode spaces: en paths contain them (e.g. "User manual/")
            # and curl rejects unencoded-space URLs, false-failing the check
            pdfrel=$(curl -s "$base/pdf-manifest.json" | grep -o '"[^"]*\.html"' | head -1 | tr -d '"' | sed 's/\.html$/.pdf/;s/ /%20/g')
            magic=$(curl -s --retry 3 "$base/$pdfrel" | head -c 4)
            if [ "$magic" != "%PDF" ]; then echo "FAIL pdf magic $base/$pdfrel"; exit 1; fi
            echo "OK manual pdf $base/$pdfrel"
          done
          echo "All health checks passed."
