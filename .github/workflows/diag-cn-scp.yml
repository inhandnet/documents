name: Diag CN scp (debug)

# Throwaway fast diagnostic for the CN deploy. Builds ONLY zh (~20s) and
# pushes via rsync over SSH (the method the server's ForceCommand wrapper
# explicitly allows: `rsync --server ... /data/wordpress/manuals`). Prints
# rsync's own error if any. ~2 min. Delete once the real deploy is fixed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update -q && sudo apt-get install -y -q sshpass rsync
      - name: Build zh only
        run: python -m mkdocs build -f mkdocs.yml -d site-zh --clean
      - name: rsync to CN (verbose)
        env:
          H: ${{ secrets.CN_OVERSEAS_HOST }}
          U: ${{ secrets.CN_OVERSEAS_USER }}
          P: ${{ secrets.CN_OVERSEAS_PASS }}
        run: |
          echo "=== try 1: rsync -az --delete ==="
          sshpass -p "$P" rsync -az --delete -v \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site-zh/ "$U@$H:/data/wordpress/manuals/" 2>&1 | tail -20 && echo "DELETE-OK" && exit 0
          echo "=== try 2: rsync -az (no --delete) ==="
          sshpass -p "$P" rsync -az -v \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site-zh/ "$U@$H:/data/wordpress/manuals/" 2>&1 | tail -20 && echo "NODELETE-OK"
