name: Import Product Draft

# 从 GitHub 仓库的规格书 md 一键生成 WordPress 产品页草稿
#
# 触发：WordPress 后台调用 GitHub API（workflow_dispatch）
#
# 需要的 Secrets（Settings → Secrets → Actions）：
#   LLM_API_KEY             LLM API key
#   WP_ZH_APP_PASSWORD      中文站 WP Application Password
#   WP_EN_APP_PASSWORD      英文站 WP Application Password
#
# 需要的 Variables（Settings → Variables → Actions）：
#   WP_ZH_URL               中文站 WordPress 地址
#   WP_ZH_ICON_URL          中文站图标 URL
#   WP_ZH_TEMPLATE_ID       中文站模板产品 ID
#   WP_EN_URL               英文站 WordPress 地址
#   WP_EN_ICON_URL          英文站图标 URL
#   WP_EN_TEMPLATE_ID       英文站模板产品 ID

on:
  workflow_dispatch:
    inputs:
      md_path:
        description: '规格书 md 路径（相对于仓库根）'
        required: true
        type: string
      site:
        description: '站点（zh 或 en）'
        required: true
        type: choice
        options: ['zh', 'en']
      product:
        description: '产品型号（如 IG532）'
        required: true
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r auto-import/requirements.txt

      - name: Run import
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL || 'https://llm-tg3jkhnwwk1q7xif.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-v4-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RAW_BASE: ${{ secrets.GITHUB_RAW_BASE || 'https://raw.githubusercontent.com/inhandnet/documents/master/' }}
          WP_ZH_URL: ${{ secrets.WP_ZH_URL }}
          WP_ZH_ICON_URL: ${{ secrets.WP_ZH_ICON_URL }}
          WP_ZH_TEMPLATE_ID: ${{ secrets.WP_ZH_TEMPLATE_ID }}
          WP_ZH_APP_PASSWORD: ${{ secrets.WP_ZH_APP_PASSWORD }}
          WP_EN_URL: ${{ secrets.WP_EN_URL }}
          WP_EN_ICON_URL: ${{ secrets.WP_EN_ICON_URL }}
          WP_EN_TEMPLATE_ID: ${{ secrets.WP_EN_TEMPLATE_ID }}
          WP_EN_APP_PASSWORD: ${{ secrets.WP_EN_APP_PASSWORD }}
        run: |
          python auto-import/scripts/import_product.py \
            --md-path "${{ inputs.md_path }}" \
            --site "${{ inputs.site }}" \
            --product "${{ inputs.product }}"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-result-${{ inputs.product }}-${{ inputs.site }}
          path: |
            import_result_*.json
            auto-import/onboarding/highlights-import/products_${{ inputs.site }}/${{ inputs.product }}.json
          retention-days: 7

      # 回调 WordPress，通知导入结果
      - name: Notify WordPress callback
        if: always()
        env:
          WP_ZH_CALLBACK_URL: ${{ secrets.WP_ZH_CALLBACK_URL }}
          WP_EN_CALLBACK_URL: ${{ secrets.WP_EN_CALLBACK_URL }}
          WP_CALLBACK_TOKEN: ${{ secrets.WP_CALLBACK_TOKEN }}
        run: |
          # 根据 site 选择回调 URL
          if [ "${{ inputs.site }}" = "zh" ]; then
            CALLBACK_URL="$WP_ZH_CALLBACK_URL"
          else
            CALLBACK_URL="$WP_EN_CALLBACK_URL"
          fi

          if [ -z "$CALLBACK_URL" ]; then
            echo "${{ inputs.site }} 站点回调 URL 未配置，跳过回调"
            exit 0
          fi

          # 读取结果文件
          RESULT_FILE=$(ls import_result_*.json 2>/dev/null | head -1)

          if [ -n "$RESULT_FILE" ]; then
            STATUS="success"
            NEW_ID=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('new_id', 0))")
            EDIT_URL=$(python -c "import json; print(json.load(open('$RESULT_FILE')).get('edit_url', ''))")
          else
            STATUS="failure"
            NEW_ID=0
            EDIT_URL=""
          fi

          # 构建回调请求
          AUTH_HEADER=""
          if [ -n "$WP_CALLBACK_TOKEN" ]; then
            AUTH_HEADER="-H \"Authorization: Bearer $WP_CALLBACK_TOKEN\""
          fi

          # 回调 WordPress
          eval curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            $AUTH_HEADER \
            -d "{
              \"run_id\": ${{ github.run_id }},
              \"status\": \"$STATUS\",
              \"product\": \"${{ inputs.product }}\",
              \"site\": \"${{ inputs.site }}\",
              \"new_id\": $NEW_ID,
              \"edit_url\": \"$EDIT_URL\"
            }" || echo "回调失败（不影响主流程）"
