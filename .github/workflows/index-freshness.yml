name: MCP index freshness

# Hourly watchdog for the Documents MCP index (https://docs-mcp.inhand.com).
#
# WHAT IT CHECKS
# The MCP service indexes master and exposes the indexed commit through its
# get_index_status tool. This job compares that active_commit with the current
# master HEAD. They should match within minutes of any push.
#
# WHY IT MATTERS -- READ THIS IF THE JOB IS RED
# When an index rebuild fails (most often a catalog validation error, see
# validate-catalog.yml) the service keeps the PREVIOUS index active and stops
# advancing. Nothing 500s and search keeps answering, just from an old commit,
# so the outage is invisible to users and to us -- it once went unnoticed for
# two weeks. A failing run here is the only alarm: GitHub emails the run's
# failure notification to repo watchers and to whoever triggered it.
#
# A red run means the published documentation index is FROZEN. Triage:
#   1. Check the latest run of "Validate catalog for MCP" on master.
#   2. On the MCP host, check the worker container log for
#      CatalogValidationError (docker logs / journalctl for the indexer).
#   3. Inspect the index_versions table: a row stuck in candidate/failed
#      state with its failure reason names the offending commit.
#
# A mismatch within 45 minutes of the HEAD commit is treated as a normal
# rebuild window and passes with a note in the log.
#
# Read-only against production. No secrets.

on:
  schedule:
    # Off the hour so it does not collide with the top-of-hour runner rush.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Compare master HEAD with the active MCP index commit
        env:
          MCP_URL: https://docs-mcp.inhand.com/mcp
          MCP_PROTOCOL_VERSION: "2025-11-25"
          # Grace period for a rebuild triggered by a very recent push.
          REBUILD_GRACE_SECONDS: "2700"
        run: |
          set -uo pipefail

          head_sha=$(git rev-parse HEAD)
          head_ts=$(git log -1 --format=%ct HEAD)
          now=$(date +%s)
          age=$((now - head_ts))
          echo "master HEAD: ${head_sha} (committed $((age / 60)) min ago)"

          fail() {
            echo "::error::$1"
            echo "The Documents MCP index could NOT be confirmed current with master."
            echo "Either the service is unreachable/changed shape, or the index is"
            echo "frozen on an old commit and will stay there until the rebuild is fixed."
            echo "Triage:"
            echo "  1. Check the latest 'Validate catalog for MCP' run on master."
            echo "  2. Check the MCP worker container log for CatalogValidationError."
            echo "  3. Check the index_versions table for a candidate/failed row and"
            echo "     read its failure reason."
            exit 1
          }

          # --- MCP streamable-HTTP handshake -------------------------------
          # initialize -> keep the session id from the response header ->
          # notifications/initialized -> tools/call get_index_status.
          # The Accept header MUST list both JSON and SSE or the server rejects
          # the request.
          headers=$(mktemp)
          init_body=$(curl -sS --max-time 30 -D "${headers}" -X POST "${MCP_URL}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"${MCP_PROTOCOL_VERSION}\",\"capabilities\":{},\"clientInfo\":{\"name\":\"index-freshness-watchdog\",\"version\":\"1\"}}}") || \
            fail "MCP initialize request to ${MCP_URL} failed (service unreachable?)"

          session_id=$(tr -d '\r' < "${headers}" | sed -n 's/^[Mm][Cc][Pp]-[Ss]ession-[Ii]d: *//p' | tail -n1)
          if [ -z "${session_id}" ]; then
            echo "initialize response headers:"; cat "${headers}"
            echo "initialize response body:"; echo "${init_body}"
            fail "MCP initialize returned no mcp-session-id header (service or auth broken?)"
          fi
          echo "MCP session established."

          curl -sS --max-time 30 -o /dev/null -X POST "${MCP_URL}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "Mcp-Session-Id: ${session_id}" \
            -H "MCP-Protocol-Version: ${MCP_PROTOCOL_VERSION}" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' || \
            fail "MCP notifications/initialized failed"

          status_body=$(curl -sS --max-time 30 -X POST "${MCP_URL}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "Mcp-Session-Id: ${session_id}" \
            -H "MCP-Protocol-Version: ${MCP_PROTOCOL_VERSION}" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_index_status","arguments":{}}}') || \
            fail "MCP tools/call get_index_status failed"

          echo "get_index_status raw response:"
          echo "${status_body}"

          # The result arrives as SSE-wrapped JSON whose text content is itself
          # escaped JSON, so pull the 40-hex sha that follows "active_commit".
          active_commit=$(echo "${status_body}" \
            | grep -oiE 'active_commit[^0-9a-f]{0,16}[0-9a-f]{40}' \
            | grep -oiE '[0-9a-f]{40}$' | head -n1)
          if [ -z "${active_commit}" ]; then
            fail "could not parse active_commit from get_index_status response (index never built, or the tool output changed shape)"
          fi
          echo "active index commit: ${active_commit}"

          # --- Verdict ------------------------------------------------------
          if [ "${active_commit}" = "${head_sha}" ]; then
            echo "OK: MCP index is current with master HEAD (${head_sha})."
            exit 0
          fi

          if [ "${age}" -lt "${REBUILD_GRACE_SECONDS}" ]; then
            echo "HEAD ${head_sha} was committed only $((age / 60)) min ago and the"
            echo "index still serves ${active_commit}. That is within the"
            echo "$((REBUILD_GRACE_SECONDS / 60))-minute rebuild window, so this is"
            echo "treated as a rebuild in progress. The next hourly run will fail if"
            echo "the index has still not advanced."
            exit 0
          fi

          echo "master HEAD  : ${head_sha}"
          echo "active index : ${active_commit}"
          echo "HEAD age     : $((age / 60)) minutes (grace: $((REBUILD_GRACE_SECONDS / 60)) minutes)"
          fail "MCP index is frozen: it still serves ${active_commit} while master HEAD has been ${head_sha} for $((age / 60)) minutes"
