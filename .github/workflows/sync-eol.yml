name: Sync EOL Products to Website

# data/eol-products.zh.md / .en.md 是官网 EOL 页面的唯一数据源。
# 合并到 master 后自动增量同步到 WordPress EOL API（新增/更新/删除全自动）；
# PR 上只做 dry-run 预演，让 review 时能看到这次改动会对官网产生什么增删改。
#
# 需要在仓库里配置（Settings → Secrets and variables → Actions）：
#   Variables : EOL_API_ZH_URL / EOL_API_EN_URL
#               填到 /wp-json/eol/v1 为止，例如 https://<host>/wp-json/eol/v1
#               测试站换正式站只改这两个变量，脚本和工作流都不写死域名。
#   Secrets   : EOL_API_ZH_TOKEN / EOL_API_EN_TOKEN（后台 EOL 管理 → API Token）
# 任一站点缺 URL 或 TOKEN 时该站点自动跳过，不会让流水线变红。
on:
  pull_request:
    branches: [master]
    paths:
      - "data/eol-products.*.md"
      - "scripts/sync_eol_products.py"
      - ".github/workflows/sync-eol.yml"
  push:
    branches: [master]
    paths:
      - "data/eol-products.*.md"
      - "scripts/sync_eol_products.py"
  workflow_dispatch:
    inputs:
      site:
        description: "同步站点"
        required: false
        default: "all"
        type: choice
        options: ["all", "zh", "en"]
      dry_run:
        description: "只预演，不写入官网"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write # 同步失败时开 issue 通知

concurrency:
  group: sync-eol
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync
        id: sync
        env:
          EOL_API_ZH_URL: ${{ vars.EOL_API_ZH_URL }}
          EOL_API_ZH_TOKEN: ${{ secrets.EOL_API_ZH_TOKEN }}
          EOL_API_EN_URL: ${{ vars.EOL_API_EN_URL }}
          EOL_API_EN_TOKEN: ${{ secrets.EOL_API_EN_TOKEN }}
        run: |
          ARGS="--site ${{ github.event.inputs.site || 'all' }}"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "sync_eol_products.py $ARGS"
          python scripts/sync_eol_products.py $ARGS 2>&1 | tee sync.log
          exit "${PIPESTATUS[0]}"

      # 同步失败 = 仓库已经改了、官网没跟上，必须有人知道。
      # 开一个 issue（不需要额外的 SMTP/webhook 密钥，GitHub 会按各人的
      # 通知设置发邮件），同一次故障不会重复开：已有未关闭的就追加评论。
      # 脚本是幂等的，修好后重跑 workflow 即可补上差异。
      - name: Notify on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('sync.log', 'utf8').split('\n').slice(-40).join('\n');
            } catch (e) {
              log = '(没有拿到日志，见 run 链接)';
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'EOL 清单同步到官网失败';
            const body = [
              `同步 run：${runUrl}`,
              `触发：${context.eventName} @ ${context.sha.substring(0, 8)}`,
              '',
              '仓库里的 EOL 清单已经变更，但官网没有同步成功，两边现在不一致。',
              '脚本是幂等的：修掉原因后重新跑一次 workflow 即可补上差异，不会重复创建记录。',
              '',
              '<details><summary>日志末尾</summary>',
              '',
              '```',
              log,
              '```',
              '',
              '</details>',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'eol-sync',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['eol-sync'],
              });
            }
