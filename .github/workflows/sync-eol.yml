name: Sync EOL Products to Website

# data/eol-products.zh.md / .en.md 是官网 EOL 页面的唯一数据源。
# 合并到 master 后自动增量同步到 WordPress EOL API；PR 上只做 dry-run 预演，
# 让 review 时能看到这次改动会对官网产生什么增删改。
#
# 需要在仓库里配置（Settings → Secrets and variables → Actions）：
#   Variables : EOL_API_ZH_URL / EOL_API_EN_URL
#               填到 /wp-json/eol/v1 为止，例如 https://<host>/wp-json/eol/v1
#               测试站换正式站只改这两个变量，脚本和工作流都不写死域名。
#   Secrets   : EOL_API_ZH_TOKEN / EOL_API_EN_TOKEN（后台 EOL 管理 → API Token）
# 任一站点缺 URL 或 TOKEN 时该站点自动跳过，不会让流水线变红。
on:
  pull_request:
    branches: [master]
    paths:
      - "data/eol-products.*.md"
      - "scripts/sync_eol_products.py"
      - ".github/workflows/sync-eol.yml"
  push:
    branches: [master]
    paths:
      - "data/eol-products.*.md"
      - "scripts/sync_eol_products.py"
  workflow_dispatch:
    inputs:
      site:
        description: "同步站点"
        required: false
        default: "all"
        type: choice
        options: ["all", "zh", "en"]
      dry_run:
        description: "只预演，不写入官网"
        required: false
        default: false
        type: boolean
      prune:
        description: "删除官网上本地没有的记录（永久删除，慎用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-eol
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync
        env:
          EOL_API_ZH_URL: ${{ vars.EOL_API_ZH_URL }}
          EOL_API_ZH_TOKEN: ${{ secrets.EOL_API_ZH_TOKEN }}
          EOL_API_EN_URL: ${{ vars.EOL_API_EN_URL }}
          EOL_API_EN_TOKEN: ${{ secrets.EOL_API_EN_TOKEN }}
        run: |
          ARGS="--site ${{ github.event.inputs.site || 'all' }}"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.prune }}" = "true" ]; then
            ARGS="$ARGS --prune"
          fi
          echo "sync_eol_products.py $ARGS"
          python scripts/sync_eol_products.py $ARGS
