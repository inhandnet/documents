    "script": "from quickfaas.measure import write_plc_values\nfrom common.Logger import logger\nimport json\nimport requests\nimport base64\n\ndef main(topic, payload): #定义订阅入口函数\n    logger.info(\"topic: %s, payload: %s\" %(topic, payload))\n    payload = json.loads(payload) #反序列化订阅数据\n    dd = payload[\"execmd\"]\n    message = dd.split('\\'')[1]\n\n\n    username_password =  '%s:%s' % ('adm','@xhs123')\n    base_auth = base64.b64encode(username_password.encode()).decode()\n    headers = {\"Authorization\": 'Basic %s' % base_auth}\n    url =  \"https://127.0.0.1/v1/user/login\"\n    results = requests.post(url, headers=headers, verify=False)\n    TT = json.loads(results.text)\n    logger.info(TT)\n\n    token = TT[\"results\"][\"web_session\"]\n    logger.info(token)\n\n    token_type = \"Bearer \"\n    headers1 = {\n            \"Authorization\":token_type + token,\n            \"Content-Type\": \"application/json; charset=GB2312\"\n    }\n    data = {}\n    data[\"device_time\"] = message\n    response = requests.put(\"https://127.0.0.1/v1/system/settime\", headers=headers1, json = data,verify=False)\n    logger.info(response.text)",
