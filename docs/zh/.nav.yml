# 中文站点的顶层导航顺序（插件：awesome-nav）
# 文档：https://lukasgeiter.github.io/mkdocs-awesome-nav/
#
# 每一项是一个产品目录名（或 index.md）。"*" 是通配符，代表所有未显式列出的项，
# 按默认（字母）顺序排在已固定项之后——未列出的产品仍会显示，只是排在后面。
#
# 若要把主打产品排在前面，在 "*" 上方列出，例如：
#   - index.md
#   - IG502
#   - EC5000
#   - "*"
#
# 当前配置保持现有顺序：首页在前，其余按字母序。
nav:
  - index.md
  - "*"
