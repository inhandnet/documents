site_name: 映翰通在线文档
site_description: 映翰通产品文档中心
# 实际部署地址（CI scp 到国内服务器 /data/wordpress/manuals/）；sitemap.xml 与 canonical 均由此生成
site_url: https://www.inhand.com.cn/manuals/

repo_url: https://github.com/inhandnet/documents
repo_name: inhandnet/documents
edit_uri: edit/master/docs/zh/

# 方案 B：中文/英文各自独立 docs_dir，构建两次输出到 / 与 /en
docs_dir: docs/zh

# 输出为 *.html（避免依赖目录 /index.html 的自动补全）
use_directory_urls: false

theme:
  name: material
  language: zh
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
#    - content.action.edit  # 隐藏编辑按钮（客户视图）
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: green
      accent: green
    - scheme: slate
      primary: green
      accent: green

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
      title: 目录
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark

extra_css:
  - stylesheets/extra-v2.css

extra_javascript:
  - javascripts/pdf-download-v3.js
  - javascripts/embed-bridge.js
  - javascripts/sidebar-search.js
  - javascripts/edit-under-title.js
  - javascripts/toc-h1.js

plugins:
  - search
  - awesome-nav
  - exclude:
      glob:
        - "**/Datasheets/**"
        - "**/datasheets/**"
        - "**/Certification Documents/**"
        - "**/certification documents/**"
        - "**/Drawings/**"
        - "**/drawings/**"

